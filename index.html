<canvas id="c"></canvas><div id="tags"></div>
<header><h1>Plot Unfolds Town</h1><span class="lcd" id="count">… residents</span>
<a class="follow" href="https://www.instagram.com/plot.unfolds/" target="_blank" rel="noopener">Follow @plot.unfolds to get a house</a></header>
<div id="searchbox"><form id="f" autocomplete="off"><input id="q" type="search" placeholder="Find your house: @username" aria-label="Instagram username" autocapitalize="none" spellcheck="false"><button id="go">Go</button></form><ul id="sug"></ul></div>
<div id="info"></div>
<div id="hint">Drag to look around · pinch / scroll to zoom · right-drag or two fingers to pan</div>
<div id="load"><div class="spin"></div>Building the town…</div>
<script type="module">
import './town.js?v=20261101163738';
const $=id=>document.getElementById(id),T=window.TOWN;
$('count').textContent=`${T.followers} residents · ${T.sectors.length} sectors`;
const info=$('info');
function show(h){if(h&&h.landmark){info.style.display='block';info.innerHTML=`<b>${h.landmark.n}</b><br>${h.landmark.sub}<div class="row"><button onclick="flyHome();info.style.display='none'">Whole town</button><button onclick="info.style.display='none'">Close</button></div>`;return}if(!h){info.style.display='block';info.innerHTML=`No house for that name yet. <b>Follow @plot.unfolds</b> and you get one in the next daily update.<div class="row"><a href="https://www.instagram.com/plot.unfolds/" target="_blank" rel="noopener">Follow</a><button onclick="info.style.display='none'">Close</button></div>`;return}
 info.style.display='block';info.innerHTML=`<b>@${h.username}</b>'s ${h.type==='villa'?'villa 🏰':'house 🏠'}<br>${h.society}, Sector ${h.sector} · resident since ${h.since}${h.upgrades.length?'<br>Upgrades: '+h.upgrades.join(', '):''}<br><small>Tag 3 friends in our latest reel's comments to upgrade to a villa.</small><div class="row"><button id="home">Whole town</button><button onclick="info.style.display='none'">Close</button></div>`;$('home').onclick=()=>{flyHome();info.style.display='none'}}
window.info=info;
function go(v){$('sug').innerHTML='';$('q').blur();show(findHouse(v))}
$('f').onsubmit=e=>{e.preventDefault();go($('q').value)};
$('q').oninput=()=>{$('sug').innerHTML=suggest($('q').value).map(u=>`<li data-u="${u}">@${u}</li>`).join('')};
$('sug').onclick=e=>{const u=e.target.dataset.u;if(u){$('q').value='@'+u;go(u)}};
const p=new URLSearchParams(location.search).get('u')||location.hash.slice(1);if(p){$('q').value='@'+p.replace(/^@/,'');setTimeout(()=>go(p),400)}
const pl=document.createElement('button');pl.id='pl';pl.textContent='📍 Places';document.body.appendChild(pl);const ls=document.createElement('div');ls.id='plist';document.body.appendChild(ls);
ls.innerHTML=window.LANDMARKS.map((L,i)=>`<button data-i="${i}">${L.n}</button>`).join('');
pl.onclick=()=>{ls.style.display=ls.style.display==='block'?'none':'block'};
ls.onclick=e=>{const i=e.target.closest('button')?.dataset.i;if(i==null)return;ls.style.display='none';const L=flyLM(+i);show({landmark:L})};
</script></body></html>
